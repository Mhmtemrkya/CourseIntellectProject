# Dedicated public management origin: password + email login code.
# No WireGuard, Cloudflare Access, device identity headers, TOTP or proxy secret.
# Install only after certificate, MFA migrations, SMTP and both accounts are ready.
#
# Gizli taban yol: panel ayrı derlenir (SITE_TARGET=admin) ve yalnız tahmin edilemez bir
# yol altında sunulur. __ADMIN_BASE_PATH__ DEPODA DEĞİL, kurulumda sunucudaki gizli değerle
# değiştirilir (/etc/courseintellect/backend-secrets.env içindeki
# COURSE_INTELLECT_ADMIN_BASE_PATH; ör. "/" + 48 hex karakter). Yayın betiği aynı değerle
# derleyip dosyaları sürüm içinde .admin<gizli-yol>/ altına koyar. Gizli yol dışındaki
# her istek 404 döner: kökte giriş sayfası ya da yönlendirme yoktur.
#
# Kurulum (root):
#   P="$(grep -E '^COURSE_INTELLECT_ADMIN_BASE_PATH=' /etc/courseintellect/backend-secrets.env | cut -d= -f2-)"
#   sed "s#__ADMIN_BASE_PATH__#${P}#g" nginx-admin-private.conf > /etc/nginx/sites-available/schoolasist-yonetim.conf
#   nginx -t && systemctl reload nginx
# Gizli yol değişirse: secrets dosyasını güncelle → yeniden yayın → bu şablonu yeniden kur.
server {
    listen 443 ssl;
    server_name yonetim.schoolasist.com;
    ssl_certificate /etc/letsencrypt/live/yonetim.schoolasist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yonetim.schoolasist.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/courseintellect/marketing-current/.admin;
    server_tokens off;
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gizli yolun kendisi panele yönlenir; derlemedeki diğer sayfalar (pazarlama kopyası) açılmaz.
    location = __ADMIN_BASE_PATH__ { return 302 __ADMIN_BASE_PATH__/admin/; }
    location = __ADMIN_BASE_PATH__/ { return 302 __ADMIN_BASE_PATH__/admin/; }
    location = __ADMIN_BASE_PATH__/admin { return 302 __ADMIN_BASE_PATH__/admin/; }
    location ^~ __ADMIN_BASE_PATH__/admin/ { try_files $uri $uri/index.html =404; }
    location ^~ __ADMIN_BASE_PATH__/_next/ { try_files $uri =404; }
    location ~ ^__ADMIN_BASE_PATH__/__next\.[^/]+\.txt$ { try_files $uri =404; }

    # Panel logosu kökten (/images/...) istenir; herkese açık görseldir, gizli yolu ele vermez.
    location ^~ /images/ {
        root /opt/courseintellect/marketing-current;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5206;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SchoolAsist-Admin-Proxy-Key "";
        proxy_set_header X-SchoolAsist-Admin-Identity "";
        proxy_set_header X-SchoolAsist-Admin-Peer "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_hide_header Cache-Control;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name yonetim.schoolasist.com;
    return 301 https://yonetim.schoolasist.com$request_uri;
}
