# SchoolAsist pazarlama sitesi — nginx güvenlik başlıkları.
# Site static export (next build, output: export) ile üretilir; bu snippet'i
# ilgili server bloğuna include edin:
#
#   server {
#     ...
#     include /etc/nginx/snippets/schoolasist-security.conf;
#   }
#
# İKİ dosya da kopyalanmalı:
#   deploy/nginx-security.conf         → /etc/nginx/snippets/schoolasist-security.conf
#   deploy/nginx-security-headers.conf → /etc/nginx/snippets/schoolasist-security-headers.conf
#
# Kurulum sonrası doğrula:  nginx -t

include /etc/nginx/snippets/schoolasist-security-headers.conf;

# Sunucu sürümünü gizle
server_tokens off;

# Return an actual HTTP 404 even if an old release still contains this file.
location = /robots.txt {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

# Yönetim ve giriş ekranları arama sonuçlarında görünmesin.
# robots.txt'e "Disallow: /admin" yazmak paneli gizlemek değil, adresini ilan
# etmek olurdu; dizinleme başlıkla engellenir. Asıl yetki kontrolü API'de.
#
# Her blok başlık snippet'ini TEKRAR include eder: add_header miras alınmaz,
# yoksa bu iki yolda CSP/HSTS dahil tüm güvenlik başlıkları kaybolurdu.
# Platform yönetim paneli herkese açık sitede YOKTUR: ayrı derlenir ve yalnız
# yonetim.schoolasist.com'da gizli bir taban yol altında sunulur (nginx-admin-private.conf).
# Sürüm klasöründeki ".admin" o derlemeyi taşır; bu alan adından asla sunulmaz.
location ^~ /admin {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
}

location ^~ /.admin {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
}

location ^~ /.webapp {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
}

# Web uygulaması (yalnız demo hesaplar) gizli bir yol altında; şablon desktop/deploy/
# nginx-web-demo.conf, yayın betiği gizli yolu yerleştirip bu adla kurar.
include /etc/nginx/snippets/schoolasist-web-demo.conf;

location = /giris {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /giris/index.html =404;
}

location ^~ /giris/ {
    include /etc/nginx/snippets/schoolasist-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ $uri/index.html =404;
}
