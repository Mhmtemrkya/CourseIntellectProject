name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer sürümü (ör. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Bağımlılıkları kur
        working-directory: desktop
        run: npm ci

      - name: macOS Developer ID sertifikasını yükle
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

          CERTIFICATE_PATH="$RUNNER_TEMP/courseintellect-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/courseintellect-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_INFO="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application:' | head -1)"
          test -n "$CERT_INFO"
          CERT_ID="$(printf '%s' "$CERT_INFO" | awk -F'\"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json >/dev/null

      - name: Sürümü etiketten ayarla
        working-directory: desktop
        shell: bash
        run: node scripts/set-desktop-version.mjs "${{ github.event.inputs.version || github.ref_name }}"

      - name: İmzalı uygulamayı oluştur ve yayınla
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REACT_APP_COURSE_INTELLECT_ENV: production
          REACT_APP_COURSE_INTELLECT_API_URL: https://api.courseintellect.com
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: "SchoolAsist Desktop v__VERSION__"
          releaseBody: "SchoolAsist macOS ve Windows masaüstü güncellemesi. Uygulama içinden güvenli biçimde indirilebilir."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: macOS dağıtım güven zincirini doğrula
        if: matrix.platform == 'macos-latest'
        working-directory: desktop
        shell: bash
        run: bash scripts/verify-macos-distribution.sh src-tauri/target

  finalize:
    name: Release'i doğrula ve yayınla
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Bütün platform dosyalarını kontrol et
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW_VERSION#desktop-v}"
          RELEASE_TAG="desktop-v$VERSION"
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -q '^latest.json$'
          printf '%s\n' "$ASSETS" | grep -Eq '\.dmg$'
          printf '%s\n' "$ASSETS" | grep -Eq '\.exe$'
          printf '%s\n' "$ASSETS" | grep -Eq '\.sig$'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
