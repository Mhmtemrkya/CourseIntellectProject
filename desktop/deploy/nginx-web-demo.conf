# SchoolAsist web uygulaması (yalnız demo hesaplar) — schoolasist.com server bloğu içinde.
# schoolasist-security.conf bu dosyayı include eder; yayın betiği __WEB_BASE_PATH__ yer
# tutucusunu sunucudaki gizli değerle (COURSE_INTELLECT_WEB_BASE_PATH, /etc/courseintellect/
# backend-secrets.env) değiştirip /etc/nginx/snippets/schoolasist-web-demo.conf olarak kurar.
# Gizli yol DEPODA DEĞİLDİR. Dosyalar sürüm içinde .webapp<gizli-yol>/ altındadır; /.webapp
# doğrudan 404 döner (nginx-security.conf).
#
# Erişim kuralı sunucudadır: bu kökenden (https://schoolasist.com) gelen isteklerde yalnız
# WebDemo:Usernames hesapları ve WebDemo:TenantId kurumu oturum açabilir (WebDemoAccessPolicy).
# Yalnız schoolasist.com'da sunulur. Snippet başka bir server bloğuna (ör. API alanı) da
# include edilse, uygulama orada API ile aynı kökende çalışır ve Origin kuralı devre dışı kalırdı.
location = __WEB_BASE_PATH__ {
    if ($host !~* ^(www\.)?schoolasist\.com$) { return 404; }
    return 302 __WEB_BASE_PATH__/;
}

location ^~ __WEB_BASE_PATH__/ {
    if ($host !~* ^(www\.)?schoolasist\.com$) { return 404; }
    root /opt/courseintellect/marketing-current/.webapp;
    try_files $uri __WEB_BASE_PATH__/index.html;

    # add_header miras alınmaz; pazarlama CSP'si uygulamayı bozacağı için burada kendi başlıkları var.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://maydanozasist.schoolasist.com https://cdn.jsdelivr.net; connect-src 'self' https://maydanozasist.schoolasist.com wss://maydanozasist.schoolasist.com; frame-src 'self' blob: https://www.openstreetmap.org https://maydanozasist.schoolasist.com; media-src 'self' blob: data: https://maydanozasist.schoolasist.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}
