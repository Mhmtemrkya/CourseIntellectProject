<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maydi · Bütün ifadeler</title>
<link rel="stylesheet" href="mascot.css">
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; --page:#eef3fb; --card:#ffffff; --ink:#182b49; --muted:#637898; --border:#d9e3f0; --accent:#247ad5; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1180px; margin:auto; padding:36px 24px 48px; }
  header { display:flex; align-items:start; justify-content:space-between; gap:20px; margin-bottom:24px; }
  h1 { font-size:30px; letter-spacing:-1px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.65; margin:0; }
  button { font:inherit; cursor:pointer; color:inherit; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  .controls button { background:var(--card); border:1px solid var(--border); padding:10px 14px; border-radius:12px; font-size:13px; }
  button[aria-pressed=true] { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent); }
  .layout { display:grid; grid-template-columns:minmax(320px,1fr) minmax(360px,1.35fr); gap:24px; align-items:start; }
  .stage { position:sticky; top:24px; height:530px; display:grid; place-items:center; overflow:hidden; border:1px solid var(--border); border-radius:28px; background:radial-gradient(ellipse at center,#d8f2ff22,transparent 70%),var(--card); }
  .stage .maydi-mascot { width:320px; height:400px; }
  .stage-title { position:absolute; left:24px; top:22px; font-size:20px; font-weight:750; }
  .stage-caption { position:absolute; bottom:24px; left:24px; right:24px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .pose { min-width:0; display:grid; justify-items:center; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:14px 8px 18px; }
  .pose .maydi-mascot { width:128px; height:160px; max-width:100%; }
  .pose-label { display:block; margin-top:8px; font-size:13px; font-weight:650; }
  .motions { margin-top:18px; }
  .motions p { margin-bottom:10px; }
  .notice { margin-top:20px; font-size:12px; }
  html[data-theme=dark] { color-scheme:dark; --page:#0a1426; --card:#111f35; --ink:#ecf5ff; --muted:#9db1cc; --border:#263a57; --accent:#59caff; }
  @media(max-width:850px) { .layout { grid-template-columns:1fr; } .stage { position:relative; top:0; height:460px; } .stage .maydi-mascot { width:272px; height:340px; } }
  @media(max-width:480px) { main { padding:24px 14px; } header { flex-direction:column; } h1 { font-size:26px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .stage { height:430px; } .stage .maydi-mascot { width:248px; height:310px; } }
</style>
<main>
  <header>
    <div><h1>Maydi’nin bütün ifadeleri</h1><p>Bir ifadeyi seç. Büyük görünümde seçili kalsın, ayrıntıları rahatça izle.</p></div>
    <div class="controls"><button type="button" id="tour" aria-pressed="false">Hepsini sırayla oynat</button><button type="button" id="theme">Koyu zemin</button></div>
  </header>
  <div class="layout">
    <section class="stage" aria-label="Seçili ifadenin büyük görünümü">
      <div class="stage-title" id="title" role="status">Normal</div>
      <span id="main-mascot" class="maydi-mascot maydi-mascot--platform" aria-hidden="true" data-maydi-state="idle">
        <span class="maydi-mascot__platform"></span><span class="maydi-mascot__viewport"><span class="maydi-mascot__rise"><span class="maydi-mascot__float"><span class="maydi-mascot__art"></span></span></span></span>
      </span>
      <p class="stage-caption" id="caption">Hafifçe süzülür; ara sıra göz kırpar.</p>
    </section>
    <div>
      <div class="grid" id="poses" role="group" aria-label="Yüz ifadeleri"></div>
      <div class="motions"><p>Diğer hareketler</p><div class="controls" id="motions"></div></div>
      <p class="notice" id="notice">Seçtiğin ifade, sen değiştirene kadar burada kalır.</p>
    </div>
  </div>
</main>
<script>
  const poses = [
    ['idle','Normal','Hafifçe süzülür; ara sıra göz kırpar.'],
    ['speaking','Konuşuyor','Ağzı ve yanındaki ses dalgaları hareket eder.'],
    ['happy','Mutlu','Neşeyle hareket eder; çevresindeki ışınlar parlar.'],
    ['thinking','Düşünüyor','Başını hafifçe eğip yukarı bakar; soru işareti hareket eder.'],
    ['guiding','Yönlendiriyor','Elini kaldırıp listeyi işaret eder.'],
    ['love','Kalpli','Gülümser; etrafındaki pembe kalpler hareket eder.']
  ];
  const motions = [['wink','Göz kırpma','Tek gözünü kapatıp açar.'],['spin','360° dönüş','İnce turkuaz ışık iziyle bir tur döner.'],['entrance','Platformdan çıkış','Platformdan yükselir, döner ve göz kırpar.']];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const mainMascot = document.querySelector('#main-mascot');
  const poseRoot = document.querySelector('#poses');
  let selected = 'idle', timer = 0, playing = false;
  const motionAllowed = () => !reduced.matches && !document.hidden;
  const emotion = name => poses.slice(1).some(pose => pose[0] === name);
  function paint(element, name) {
    const animate = motionAllowed();
    const shown = !animate && ['wink','spin','entrance'].includes(name) ? 'idle' : name;
    element.dataset.maydiState = shown;
    element.classList.toggle('maydi-mascot--animated', animate);
    element.classList.toggle('maydi-mascot--entrance', shown === 'entrance');
    const art = element.querySelector('.maydi-mascot__art');
    art.className = 'maydi-mascot__art maydi-mascot__art--' + shown;
    const asset = shown === 'entrance' ? 'spin' : animate && emotion(shown) ? shown + '-loop' : shown;
    art.style.backgroundImage = 'url("' + asset + '.webp")';
  }
  for (const [name,label] of poses) {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'pose'; button.dataset.pose = name;
    button.setAttribute('aria-pressed', String(name === selected));
    button.innerHTML = '<span class="maydi-mascot maydi-mascot--platform" aria-hidden="true"><span class="maydi-mascot__platform"></span><span class="maydi-mascot__viewport"><span class="maydi-mascot__rise"><span class="maydi-mascot__float"><span class="maydi-mascot__art"></span></span></span></span></span><span class="pose-label">' + label + '</span>';
    button.addEventListener('click', () => { stopTour(); select(name); });
    poseRoot.appendChild(button); paint(button.querySelector('.maydi-mascot'), name);
  }
  for (const [name,label] of motions) {
    const button = document.createElement('button'); button.type = 'button'; button.dataset.motion = name; button.textContent = label;
    button.addEventListener('click', () => { stopTour(); select(name); });
    document.querySelector('#motions').appendChild(button);
  }
  function select(name) {
    selected = name;
    const descriptor = [...poses,...motions].find(pose => pose[0] === name);
    document.querySelector('#title').textContent = descriptor[1];
    document.querySelector('#caption').textContent = descriptor[2];
    document.querySelectorAll('[data-pose]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.pose === name)));
    // Replacing the artwork restarts a finite motion even when selected repeatedly.
    mainMascot.classList.remove('maydi-mascot--entrance');
    void mainMascot.offsetWidth;
    const art = mainMascot.querySelector('.maydi-mascot__art');
    art.replaceWith(art.cloneNode()); paint(mainMascot, name);
    if (playing) scheduleTour();
  }
  mainMascot.addEventListener('animationend', event => {
    if (!event.target.classList.contains('maydi-mascot__art')) return;
    paint(mainMascot, mainMascot.dataset.maydiState === 'entrance' ? 'wink' : 'idle');
  });
  function stopTour() { playing = false; clearTimeout(timer); document.querySelector('#tour').setAttribute('aria-pressed','false'); document.querySelector('#tour').textContent = 'Hepsini sırayla oynat'; }
  function scheduleTour() { clearTimeout(timer); if (!playing || !motionAllowed()) return; timer = setTimeout(() => { const order = [...poses,...motions].map(pose => pose[0]); select(order[(order.indexOf(selected)+1)%order.length]); }, 4800); }
  document.querySelector('#tour').addEventListener('click', () => { if (playing) stopTour(); else { playing = true; document.querySelector('#tour').setAttribute('aria-pressed','true'); document.querySelector('#tour').textContent = 'Sırayla oynatmayı durdur'; select('idle'); } });
  document.querySelector('#theme').addEventListener('click', event => { const dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; event.target.textContent = dark ? 'Açık zemin' : 'Koyu zemin'; });
  function refresh() {
    document.querySelectorAll('[data-pose]').forEach(button => paint(button.querySelector('.maydi-mascot'), button.dataset.pose));
    paint(mainMascot, selected); scheduleTour();
    document.querySelector('#notice').textContent = reduced.matches ? 'Hareketi azalt ayarı açık: ifadeler sabit gösteriliyor.' : 'Seçtiğin ifade, sen değiştirene kadar burada kalır.';
  }
  reduced.addEventListener('change', refresh); document.addEventListener('visibilitychange', refresh);
  const ready = Promise.all(['idle','spin','wink',...poses.slice(1).flatMap(pose => [pose[0],pose[0]+'-loop'])].map(name => new Promise((resolve,reject) => { const image = new Image(); image.onload = resolve; image.onerror = reject; image.src = name+'.webp'; })));
  ready.then(() => { paint(mainMascot, selected); }).catch(() => { document.querySelector('#notice').textContent = 'Bazı görseller yüklenemedi. Sayfayı yenileyerek tekrar deneyebilirsin.'; });
  paint(mainMascot,'idle');
</script>
</html>
